# Isolated HTTPS test server; never include this in the production configuration.
ServerRoot "C:/xampp/apache"
Listen 127.0.0.1:18444
ServerName www.edtech.hivecolab.com
PidFile "C:/Users/HUMBLE~1/AppData/Local/Temp/opencode/edtech-apache.pid"
ErrorLog "C:/Users/HUMBLE~1/AppData/Local/Temp/opencode/edtech-apache.log"
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule headers_module modules/mod_headers.so
LoadModule ssl_module modules/mod_ssl.so
LoadFile "C:/xampp/php/php8ts.dll"
LoadModule php_module "C:/xampp/php/php8apache2_4.dll"
PHPIniDir "C:/xampp/php"
php_value error_log "C:/Users/HUMBLE~1/AppData/Local/Temp/opencode/edtech-apache-php.log"
TypesConfig conf/mime.types
DocumentRoot "D:/projects/edtech-site"
DirectoryIndex index.php
<Directory "D:/projects/edtech-site">
    Options FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>
SSLEngine on
SSLCertificateFile "C:/xampp/apache/conf/ssl.crt/server.crt"
SSLCertificateKeyFile "C:/xampp/apache/conf/ssl.key/server.key"
